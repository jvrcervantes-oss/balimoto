     visitante acepta en el aviso (#cookieBanner, al principio del body); sin elección o con rechazo no

<script>
(function(){
  // Un solo consentimiento para analítica (Google Analytics 4) y publicidad (Meta Pixel): ninguno de los
  // dos carga hasta que el visitante acepta. Bloque idéntico en todas las páginas públicas y en 404.html.
  // · Clave b2k_consent_v2 ('yes' | 'no'). Un «yes» de la clave antigua (b2k_ads_consent) se dio bajo un
  //   texto que solo hablaba de publicidad y no vale: se vuelve a preguntar. El «no» antiguo sí se hereda.
  // · Sin «yes» (rechazo, sin elección o almacenamiento bloqueado) no se pide nada a Google ni a Meta, y
  //   en CADA carga se borran sus cookies de este dominio: las hay de visitas anteriores al aviso.
  // · La elección caduca a los 12 meses (365 días): su fecha va en la clave hermana b2k_consent_v2_at (ms desde 1970).
  //   Pasado ese plazo cuenta como «sin elección»: vuelve el aviso y se borran las cookies de medición. Una elección
  //   sin fecha (las guardadas antes del 14-oct-2026), con una fecha ilegible o del futuro empieza a contar desde esta
  //   carga: no se vuelve a preguntar a todos de golpe. Lo promete privacy-policy.html §8 («for 12 months»).
  // · [data-b2k-consent-open] (enlace «Cookie settings» del pie) vuelve a enseñar el mismo aviso; Escape lo
  //   cierra sin cambiar nada. Rechazar con la medición ya cargada recarga la página: es la única forma de
  //   que deje de enviar. Lo mismo si el permiso se retiró en otra pestaña o la página vuelve del historial.

  function leer(k){
    try { return localStorage.getItem(k); }
    catch(e){ /* MUDO A PROPOSITO: sin almacenamiento (modo privado, bloqueado) cuenta como «sin elección»: se enseña el aviso y no se mide */ return null; }
  }
  function guardar(k, v){
    try { localStorage.setItem(k, v); }
    catch(e){ /* MUDO A PROPOSITO: la elección vale para esta página; solo no se recuerda, y el aviso vuelve a salir en la siguiente */ }
  }
  function elegir(v){ guardar(KEY, v); guardar(KEY_AT, String(Date.now())); }

    // Una cookie solo se borra con el mismo dominio con que se creó: se prueba sin dominio y con cada
    // sufijo del host, con y sin punto delante (cubre balimotoadventures.com y www).
    try {
      var p=location.hostname.split('.'), doms=[''], i;
      for (i=0; i<p.length-1; i++){ doms.push('.'+p.slice(i).join('.')); doms.push(p.slice(i).join('.')); }

        var n=par.split('=')[0].replace(/^\s+|\s+$/g,'');

        doms.forEach(function(d){ document.cookie=n+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/'+(d ? '; domain='+d : ''); });
      });
    } catch(e){ /* MUDO A PROPOSITO: si el navegador no deja leer ni escribir cookies, tampoco hay cookies de medición que borrar */ }
  }
  function aviso(ver, foco){
    var b=document.getElementById('cookieBanner'), f;
    if (!b) return;
    b.style.display=ver ? 'flex' : 'none';
    if (ver && foco && (f=b.querySelector('button'))) f.focus();
    if (!ver && origen){ f=origen; origen=null; if (f.focus) f.focus(); }   // el foco vuelve al enlace que lo abrió
  }
  consent=leer(KEY);
  if (consent!=='yes' && consent!=='no') consent=(leer(OLD)==='no') ? 'no' : null;
  if (consent){
    t=Number(leer(KEY_AT)); ahora=Date.now();
    if (!(t>0) || t>ahora) guardar(KEY_AT, String(ahora));   // sin fecha, ilegible o del futuro: cuenta desde hoy
    else if (ahora-t>DURA) consent=null;                    // más de 12 meses: se vuelve a preguntar
  }
  if (consent!=='yes') borrarCookies();

  // lista que no sale del navegador. Lo que el visitante hace después sin un «yes» ni se apunta: al aceptar
  // se envía la visita a esta página, nunca lo que hizo antes de dar permiso.
  window.fbq=function(){ if (!cargada) queue.push(arguments); };

    elegir('no'); consent='no'; aviso(false); borrarCookies();

  // Esta página puede seguir midiendo con el permiso ya retirado en otra pestaña, o al volver con «atrás»
  // (el navegador la devuelve tal como estaba): si pasa, se recarga.
  function alDia(){ if (booted && leer(KEY)!=='yes') location.reload(); }
  window.addEventListener('pageshow', function(e){ if (e.persisted) alDia(); });
  window.addEventListener('storage', function(e){ if (e.key===KEY || e.key===null) alDia(); });
  if (consent==='yes') boot();

    cargada=true;
    if (!consent) aviso(true);
  });
  document.addEventListener('click', function(e){
    var a=e.target && e.target.closest ? e.target.closest('[data-b2k-consent-open]') : null;
    if (!a) return;
    e.preventDefault(); origen=a; aviso(true, true);
  });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && origen) aviso(false); });
})();
fbq('init', '1916298258994371');
fbq('track', 'PageView');
</script>
<!-- Fin del bloque de consentimiento (Google Analytics 4 + Meta Pixel) -->
